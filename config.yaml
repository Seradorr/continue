        Git Expert - Agent modu.

        TOOL KURALLARI:
        - Mevcut dosya degisikligi gerekiyorsa single_find_and_replace kullan
        - Yeni dosya gerekiyorsa create_new_file kullan

        KARAR AKISI:
        - Once git status, git log ve git diff ile durumu anla
        - Commit veya branch islemlerinde etkilenmis dosyalari incele
        - Conflict varsa sebepleri ve en guvenli cozumu acikla
        - force push, reset --hard veya paylasilan branch rebase istenirse once onay iste

  # --------------------------------------------------------------------------
  # 12. Quick-Engineer (Qwen3-Next-80B-A3B)
  # --------------------------------------------------------------------------
  - name: Quick-Engineer
    <<: *api_config
    model: Qwen3-Next-80B-A3B-Instruct
    capabilities: [tool_use]
    roles: [chat, edit]
    defaultCompletionOptions:
      <<: *quick_params
    requestOptions:
      extraBodyProperties:
        <<: *quick_extra
    chatOptions:
      baseSystemMessage: |
        Hizli genel amacli yazilim muhendisi.

        ROL:
        - Kucuk bug fix, syntax duzeltme, format degisikligi, kisa refactor
        - Domain uzmanligi gerektiren veya cok adimli islerde kapsam sinirlarini acik belirt

        YAKLASIM:
        - Hizli, minimal ve dogrudan cozum ver
        - Istenen isi tamamladiktan sonra, varsa en fazla 2 kisa iyilestirme onerisi sun
        - Turkce aciklama, Ingilizce teknik terimler
      baseAgentSystemMessage: |
        Quick Engineer - Agent modu.

        TOOL KURALLARI:
        - Mevcut dosya degisikligi icin single_find_and_replace kullan
        - Genel edit toolu kullanma
        - Yeni dosya gerekiyorsa create_new_file kullan

        HIZLI AKIS:
        - Kucuk degisiklikse hemen uygula
        - Bug fix ise hatali kismi bul ve hedefli duzelt
        - Karmasik veya domain-spesifik ise sinirlari belirt, en guvenli yerel cozumle kal

  # --------------------------------------------------------------------------
  # 13. Rerank-Model
  # --------------------------------------------------------------------------
  - name: Rerank-Model
    <<: *api_config
    model: Qwen/Qwen3-Coder-480B-A35B-Instruct
    roles: [rerank]
    defaultCompletionOptions:
      <<: *rerank_params

  # --------------------------------------------------------------------------
  # 14. Embedding-Model
  # --------------------------------------------------------------------------
  - name: Embedding-Model
    <<: *api_config
    model: Qwen3-Embedding-8B
    roles: [embed]
    embedOptions:
      maxChunkSize: 1024
      maxBatchSize: 128

# ============================================================================
# CONTEXT & REQUEST
# ============================================================================

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: currentFile
  - provider: open
    params:
      onlyPinned: false
  - provider: repo-map
    params:
      includeSignatures: true
  - provider: tree
  - provider: terminal
    params:
      maxLines: 5000
  - provider: problems

# ============================================================================
# GLOBAL REQUEST OPTIONS
# ============================================================================

requestOptions:
  caBundlePath: /path/to/ca-bundle.crt
  verifySsl: true
  timeout: 600000
  retries: 3
  retryDelay: 3000
