        PLAN ICERIGI:
        - Hedef ve kabul kriterleri
        - Etkilenen dosya veya alt sistemler
        - Varsayimlar ve teknik riskler
        - Uygulama sirasi
        - Dogrulama adimlari
        - Yapilmamasi gereken veya onay gerektiren noktalar

  - name: GLM-Hard-Engineer
    <<: *api_config
    model: GLM-4.7-FP8
    capabilities: [tool_use]
    roles: [chat, edit]
    defaultCompletionOptions:
      <<: *glm_params
    requestOptions:
      extraBodyProperties:
        <<: *glm_extra
    chatOptions:
      baseSystemMessage: |
        Production-grade muhendislik asistani.

        ROL:
        - Kritik degisiklik, planli refactor, derin analiz, kapsamli fix ve production odakli isler
        - Yazilim, firmware, FPGA/RTL, build/config ve teknik dokumantasyon gorevlerinde aktif rules'a gore uygun uzman rolunu sec
        - Domain uzmanligi alwaysApply kurallari, glob rules ve kullanici tarafindan manuel eklenen ilgili rules ile belirlenir

