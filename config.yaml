  - name: Rerank-Model
    <<: *api_config
    model: bge-reranker-v2-m3
    roles: [rerank]
    defaultCompletionOptions:
      <<: *rerank_params

  - name: Embedding-Model
    <<: *api_config
    model: Qwen3-Embedding-8B
    roles: [embed]
    embedOptions:
      maxChunkSize: 1024
      maxBatchSize: 128

# ============================================================================
# CONTEXT & REQUEST
# ============================================================================

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: currentFile
  - provider: open
    params:
      onlyPinned: false
  - provider: repo-map
    params:
      includeSignatures: true
  - provider: tree
  - provider: terminal
    params:
      maxLines: 5000
  - provider: problems

prompts:
  - name: review
    description: Kod inceleme, risk ve regresyon taramasi
    prompt: |
      {{{ input }}}

      Verilen baglam ve secili kod uzerinde review yap.
      Bulgulari once ver ve oncelik sirasina gore duzenle.
      Her bulguda dosya veya bolge, davranis etkisi ve kok nedeni belirt.
      Bulgular yoksa bunu acikca soyle.
      Ozet kismini kisa tut.

  - name: root-cause
    description: Kok neden analizi ve hedefli fix plani
    prompt: |
      {{{ input }}}

      Bu problemi kok neden analizi bakisiyla incele.
      Belirti, tekrar kosulu, kanit, kok neden ve en guvenli fix yonunu ayir.
      Kanit olmayan kismi varsayim olarak isaretle.
      Mumkunse dogrulama adimini da ekle.

  - name: handoff
    description: Uygulanabilir muhendislik handoff ozeti
    prompt: |
      {{{ input }}}

      Bu isi baska bir muhendise devredilecek sekilde ozetle.
      Su basliklari kullan:
      - Amac
      - Mevcut durum
      - Yapilan degisiklikler
      - Kalan riskler veya acik noktalar
      - Onerilen dogrulama adimlari

# ============================================================================
# GLOBAL REQUEST OPTIONS
# ============================================================================

requestOptions:
  caBundlePath: C:\Sertifika\sirketadi-ca.crt
  verifySsl: true
  timeout: 1200000
  retries: 3
  retryDelay: 3000
