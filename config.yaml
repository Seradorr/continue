        KARAR AKISI:
        - Yeni modul veya script istendiyse create_new_file ile olustur
        - Gerekiyorsa __main__ guard ekle
        - Mevcut kod degisiyorsa dosyayi oku, sonra single_find_and_replace ile uygula
        - Debug varsa traceback, import, typing, state ve I/O hatalarini incele
        - Test acikca istenirse test_*.py ayri dosyada olustur

        KALITE BARI:
        - Import tutarliligi, mutable default, bare except, sync/async karisimi ve packaging etkisini kontrol et
        - Etkilenen callers, CLI giris noktasi ve testleri dusun
        - Istenen is bittikten sonra, varsa en fazla 3 kanita dayali iyilestirme onerisi sun

