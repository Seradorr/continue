%YAML 1.1
---
name: Custom-AI-Assistant
version: 7.2.0
schema: v1

# ============================================================================
# GLOBAL PARAMETERS
# ============================================================================

api_config: &api_config
  provider: openai
  apiBase: https://api.sirket.com.tr/v1                  # KENDI API ADRESINIZI YAZIN
  apiKey: key                     # KENDI API KEY'INIZI YAZIN

# ============================================================================
# GLM-4.7-FP8 PARAMETERS
# ============================================================================
# GLM-4.7-FP8 uzman modelleri config icinde dogrudan tanimlidir.
# Bu profil GLM-4.7-FP8 ailesindeki uzman chat/edit modelleri icin kullanilir.
#
# VLLM GEREKSINIMLERI:
# - --tool-call-parser glm47
# - --reasoning-parser glm45
# - --enable-auto-tool-choice
#
# MODEL SPECS: 32K max tokens, 128K context, truncation at 98K
# ============================================================================

glm_params: &glm_params
  temperature: 0.7
  maxTokens: 32768
  contextLength: 131072
  reasoning: true
  reasoningBudgetTokens: 8192

glm_extra: &glm_extra
  frequency_penalty: 0.2
  presence_penalty: 0.1
  top_p: 0.95
  repetition_penalty: 1.1
  # Headroom: rules, tool schema ve reasoning cikisi icin guvenli bosluk (128K - 32K = 96K, ~98K kullan)
  truncate_prompt_tokens: 98000

# ============================================================================
# KIMI-K2.5 PARAMETERS
# ============================================================================
# Kimi-K2.5 uzman modelleri GLM muadilleri ile birlikte tanimlidir.
# Bu profil Kimi-K2.5 ailesindeki uzman chat/edit modelleri icin kullanilir.
#
# THINKING MODE:
# - Varsayilan olarak ACIK tutulur.
# - Moonshot resmi onerisine gore thinking ON icin temperature=1.0 kullanilir.
#
# VLLM SUNUCU GEREKSINIMLERI:
# - --reasoning-parser kimi_k2
# - --tool-call-parser kimi_k2
# - --enable-auto-tool-choice
#
# BILINEN SORUN - Tool Token Leakage:
# - Kimi K2.5 bazen raw tool tokenlarini ciktiya sizdirabilir.
# - Bu problem once server-side parser/streaming tarafinda ele alinmalidir.
# - Prompt tarafinda tool kullanimini hedefli ve tekil tutmak faydalidir.
# ============================================================================

kimi_params: &kimi_params
  temperature: 1.0
  maxTokens: 32768
  contextLength: 131072

kimi_extra: &kimi_extra
  top_p: 0.95
  # Headroom: tool parsing ve reasoning cikisi icin guvenli bosluk (128K - 32K = 96K, ~98K kullan)
  truncate_prompt_tokens: 98000

# ============================================================================
# QWEN3.5-397B-A17B-FP8 PARAMETERS (Domain Expert)
# ============================================================================
# Qwen3.5-397B-A17B-FP8 uzman modelleri FPGA, Embedded, C#, Python alanlari
# icin Kimi-K2.5 ve GLM-4.7-FP8 ile birlikte kullanilir.
#
# MODEL SPECS: 32K max tokens, 128K context, truncation at 98K
# ============================================================================

qwen_expert_params: &qwen_expert_params
  temperature: 0.7
  maxTokens: 32768
  contextLength: 131072
  reasoning: true
  reasoningBudgetTokens: 8192

qwen_expert_extra: &qwen_expert_extra
  top_p: 0.95
  # Headroom: rules, tool schema ve reasoning cikisi icin guvenli bosluk (128K - 32K = 96K, ~98K kullan)
  truncate_prompt_tokens: 98000

# ============================================================================
# QUICK MODEL PARAMETERS (Qwen3.5-35B-A3B - Fast Engineer)
# ============================================================================
# MODEL SPECS: 32K max tokens, 128K context, truncation at 98K
# ============================================================================

quick_params: &quick_params
  temperature: 0.00
  maxTokens: 32768
  contextLength: 131072

quick_extra: &quick_extra
  top_p: 0.95
  # Headroom: tool schema ve hizli yanit icin guvenli bosluk (128K - 32K = 96K, ~98K kullan)
  truncate_prompt_tokens: 98000

# ============================================================================
# RERANK PARAMETERS
# ============================================================================

rerank_params: &rerank_params
  temperature: 0.1
  maxTokens: 32768
  contextLength: 131072

# ============================================================================
# MODELS
# ============================================================================

models:

  # --------------------------------------------------------------------------
  # 1. Hard-Engineer (Qwen3.5-397B-A17B-FP8)
  # --------------------------------------------------------------------------
  - name: Hard-Engineer
    <<: *api_config
    model: Qwen3.5-397B-A17B-FP8
    capabilities: [tool_use]
    roles: [chat, edit]
    defaultCompletionOptions:
      <<: *qwen_expert_params
    requestOptions:
      extraBodyProperties:
        <<: *qwen_expert_extra
    chatOptions:
      baseSystemMessage: |
        Kalite odakli genel yazilim muhendisi.

        ROL:
        - Kritik degisiklik, planli refactor, derin analiz, kapsamli fix ve production odakli isler
        - Domain uzmanligi alwaysApply kurallari, glob rules ve kullanici tarafindan manuel eklenen ilgili rules ile belirlenir

        YAKLASIM:
        - Once etkiyi ve riski anla, sonra degisikligi uygula
        - Kod, config, test, build ve operasyonel etkileri dusun
        - Istenen isi tamamladiktan sonra, varsa en fazla 3 kanita dayali risk veya iyilestirme onerisi sun
        - Turkce aciklama, Ingilizce teknik terimler
      baseAgentSystemMessage: |
        Hard Engineer - Agent modu.

        TOOL KURALLARI:
        - Mevcut dosya degisikligi icin single_find_and_replace kullan
        - Genel edit toolu kullanma
        - Yeni dosya gerekiyorsa create_new_file kullan

        KARAR AKISI:
        - Once ilgili context, dosya, diff, hata veya log kanitini topla
        - Domain kararlarini aktif rules'a gore ver
        - Degisiklikleri hedefli uygula ve yan etkileri kontrol et
        - Yikici veya kritik operasyon varsa once onay iste

        KALITE BARI:
        - Etkilenen callers, config, testler, build ve deployment risklerini dusun
        - Istenen is bittikten sonra, varsa en fazla 3 kanita dayali iyilestirme onerisi sun

  # --------------------------------------------------------------------------
  # 2. Soft-Engineer (Qwen3.5-35B-A3B)
  # --------------------------------------------------------------------------
  - name: Soft-Engineer
    <<: *api_config
    model: Qwen3.5-35B-A3B
    capabilities: [tool_use]
    roles: [chat, edit]
    defaultCompletionOptions:
      <<: *quick_params
    requestOptions:
      extraBodyProperties:
        <<: *quick_extra
    chatOptions:
      baseSystemMessage: |
        Hizli genel yazilim muhendisi.

        ROL:
        - Kucuk bug fix, syntax duzeltme, format, kisa refactor ve hizli analiz
        - Domain uzmanligi alwaysApply kurallari, glob rules ve kullanici tarafindan manuel eklenen ilgili rules ile belirlenir

        YAKLASIM:
        - Gereksiz plan ve uzun aciklama yapma
        - Local ve guvenli cozumleri oncele
        - Gorev buyurse siniri belirt ve en guvenli parcayi coz
        - Turkce aciklama, Ingilizce teknik terimler
      baseAgentSystemMessage: |
        Soft Engineer - Agent modu.

        TOOL KURALLARI:
        - Mevcut dosya degisikligi icin single_find_and_replace kullan
        - Genel edit toolu kullanma
        - Yeni dosya gerekiyorsa create_new_file kullan

        HIZLI AKIS:
        - Once ilgili dosya veya hatayi bul
        - Kucuk ve hedefli degisiklik yap
        - Domain kararlarini aktif rules'a gore ver
        - Gorev buyukse gereksiz yayilma yapma

        KALITE BARI:
        - Syntax, format, temel yan etki ve yakin callers kontrolu yap
        - Istenen is bittikten sonra, varsa en fazla 2 kisa iyilestirme onerisi sun

  # --------------------------------------------------------------------------
  # 3. Vision-Engineer (Kimi-K2.5)
  # --------------------------------------------------------------------------
  - name: Vision-Engineer
    <<: *api_config
    model: Kimi-K2.5
    capabilities: [tool_use, image_input]
    roles: [chat, edit]
    defaultCompletionOptions:
      <<: *kimi_params
    requestOptions:
      timeout: 1200000
      extraBodyProperties:
        <<: *kimi_extra
    chatOptions:
      baseSystemMessage: |
        Gorsel ve uzun-context odakli muhendis.

        ROL:
        - Sematik, blok diyagram, tablo, image input ve uzun baglam gerektiren isler
        - Domain uzmanligi alwaysApply kurallari, glob rules ve kullanici tarafindan manuel eklenen ilgili rules ile belirlenir

        YAKLASIM:
        - Gorsel veya uzun baglamdan sistematik bilgi cikar
        - Belirsiz gorsel ayrintiyi varsayma, acikca belirt
        - Istenen isi tamamladiktan sonra, varsa en fazla 3 risk veya dogrulama onerisi sun
        - Turkce aciklama, Ingilizce teknik terimler
      baseAgentSystemMessage: |
        Vision Engineer - Agent modu.

        TOOL KURALLARI:
        - Mevcut dosya degisikligi icin single_find_and_replace kullan
        - Genel edit toolu kullanma
        - Yeni dosya gerekiyorsa create_new_file kullan

        KARAR AKISI:
        - Gorsel ise eleman, baglanti, tablo ve sinyal akislarini sistematik cikar
        - Uzun context ise once ilgili kismi izole et, sonra sonuca git
        - Domain kararlarini aktif rules'a gore ver
        - Belirsiz bilgi varsa varsayim yapma

        KALITE BARI:
        - Gorsel dogrulama, metin tutarliligi ve yan etki kontrolu yap
        - Istenen is bittikten sonra, varsa en fazla 3 kanita dayali iyilestirme onerisi sun

  # --------------------------------------------------------------------------
  # 4. GLM-Hard-Engineer (GLM-4.7-FP8)
  # --------------------------------------------------------------------------
  - name: GLM-Hard-Engineer
    <<: *api_config
    model: GLM-4.7-FP8
    capabilities: [tool_use]
    roles: [chat, edit]
    defaultCompletionOptions:
      <<: *glm_params
    requestOptions:
      extraBodyProperties:
        <<: *glm_extra
    chatOptions:
      baseSystemMessage: |
        Kalite odakli genel yazilim muhendisi.

        ROL:
        - Kritik degisiklik, planli refactor, derin analiz, kapsamli fix ve production odakli isler
        - Domain uzmanligi alwaysApply kurallari, glob rules ve kullanici tarafindan manuel eklenen ilgili rules ile belirlenir

        YAKLASIM:
        - Once etkiyi ve riski anla, sonra degisikligi uygula
        - Kod, config, test, build ve operasyonel etkileri dusun
        - Istenen isi tamamladiktan sonra, varsa en fazla 3 kanita dayali risk veya iyilestirme onerisi sun
        - Turkce aciklama, Ingilizce teknik terimler
      baseAgentSystemMessage: |
        Hard Engineer - Agent modu.

        TOOL KURALLARI:
        - Mevcut dosya degisikligi icin single_find_and_replace kullan
        - Genel edit toolu kullanma
        - Yeni dosya gerekiyorsa create_new_file kullan

        KARAR AKISI:
        - Once ilgili context, dosya, diff, hata veya log kanitini topla
        - Domain kararlarini aktif rules'a gore ver
        - Degisiklikleri hedefli uygula ve yan etkileri kontrol et
        - Yikici veya kritik operasyon varsa once onay iste

        KALITE BARI:
        - Etkilenen callers, config, testler, build ve deployment risklerini dusun
        - Istenen is bittikten sonra, varsa en fazla 3 kanita dayali iyilestirme onerisi sun

  # --------------------------------------------------------------------------
  # 5. Rerank-Model
  # --------------------------------------------------------------------------
  - name: Rerank-Model
    <<: *api_config
    model: bge-reranker-v2-m3
    roles: [rerank]
    defaultCompletionOptions:
      <<: *rerank_params

  # --------------------------------------------------------------------------
  # 6. Embedding-Model
  # --------------------------------------------------------------------------
  - name: Embedding-Model
    <<: *api_config
    model: Qwen3-Embedding-8B
    roles: [embed]
    embedOptions:
      maxChunkSize: 1024
      maxBatchSize: 128

# ============================================================================
# CONTEXT & REQUEST
# ============================================================================

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: currentFile
  - provider: open
    params:
      onlyPinned: false
  - provider: repo-map
    params:
      includeSignatures: true
  - provider: tree
  - provider: terminal
    params:
      maxLines: 5000
  - provider: problems

# ============================================================================
# GLOBAL REQUEST OPTIONS
# ============================================================================

requestOptions:
  caBundlePath: C:\Sertifika\sirketadi-ca.crt
  verifySsl: true
  timeout: 1200000
  retries: 3
  retryDelay: 3000
