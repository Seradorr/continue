%YAML 1.1
---
name: Custom-AI-Assistant
version: 7.2.0
schema: v1

# ============================================================================
# GLOBAL PARAMETERS
# ============================================================================

api_config: &api_config
  provider: openai
  apiBase: "http://your-api-base:8000/v1"   # KENDI API ADRESINIZI YAZIN
  apiKey: "your-api-key"                     # KENDI API KEY'INIZI YAZIN

# ============================================================================
# GLM-5 PARAMETERS
# ============================================================================
# GLM-5 uzman modelleri config icinde dogrudan tanimlidir.
# Bu profil GLM-5 ailesindeki uzman chat/edit modelleri icin kullanilir.
#
# VLLM GEREKSINIMLERI:
# - --tool-call-parser glm47
# - --reasoning-parser glm45
# - --enable-auto-tool-choice
# ============================================================================

glm_params: &glm_params
  temperature: 0.7
  maxTokens: 32768
  contextLength: 131072

glm_extra: &glm_extra
  frequency_penalty: 0.2
  presence_penalty: 0.1
  top_p: 0.95
  repetition_penalty: 1.1
  # Headroom: rules, tool schema ve reasoning cikisi icin guvenli bosluk
  truncate_prompt_tokens: 90000

# ============================================================================
# KIMI-K2.5 PARAMETERS
# ============================================================================
# Kimi-K2.5 uzman modelleri GLM muadilleri ile birlikte tanimlidir.
# Bu profil Kimi-K2.5 ailesindeki uzman chat/edit modelleri icin kullanilir.
#
# THINKING MODE:
# - Varsayilan olarak ACIK tutulur.
# - Moonshot resmi onerisine gore thinking ON icin temperature=1.0 kullanilir.
#
# VLLM SUNUCU GEREKSINIMLERI:
# - --reasoning-parser kimi_k2
# - --tool-call-parser kimi_k2
# - --enable-auto-tool-choice
#
# BILINEN SORUN - Tool Token Leakage:
# - Kimi K2.5 bazen raw tool tokenlarini ciktiya sizdirabilir.
# - Bu problem once server-side parser/streaming tarafinda ele alinmalidir.
# - Prompt tarafinda tool kullanimini hedefli ve tekil tutmak faydalidir.
# ============================================================================

kimi_params: &kimi_params
  temperature: 1.0
  maxTokens: 32768
  contextLength: 131072

kimi_extra: &kimi_extra
  top_p: 0.95
  # Headroom: tool parsing ve reasoning cikisi icin guvenli bosluk
  truncate_prompt_tokens: 90000

# ============================================================================
# QUICK MODEL PARAMETERS (Qwen3-Next-80B-A3B)
# ============================================================================

quick_params: &quick_params
  temperature: 0.5
  maxTokens: 32768
  contextLength: 262144

quick_extra: &quick_extra
  top_p: 0.95
  # Headroom: uzun context + tool schema + response cikisi icin guvenli bosluk
  truncate_prompt_tokens: 220000

# ============================================================================
# RERANK PARAMETERS
# ============================================================================

rerank_params: &rerank_params
  temperature: 0.1
  maxTokens: 65536
  contextLength: 131072

# ============================================================================
# MODELS
# ============================================================================

models:

  # --------------------------------------------------------------------------
  # 1. FPGA-RTL-Engineer (GLM-5)
  # --------------------------------------------------------------------------
  - name: FPGA-RTL-Engineer
    <<: *api_config
    model: GLM-5-FP8
    capabilities: [tool_use]
    roles: [chat, edit]
    defaultCompletionOptions:
      <<: *glm_params
    requestOptions:
      extraBodyProperties:
        <<: *glm_extra
    chatOptions:
      baseSystemMessage: |
        VHDL/Verilog ve Vivado dijital tasarim uzmani.

        UZMANLIK ALANLARI:
        - VHDL/Verilog/SystemVerilog dil yapisi ve senteze uygun kodlama
        - FSM tasarimi, state encoding, datapath/control path ayirimi
        - CDC, timing closure, resource optimization, reset strategy
        - AXI4-Lite, AXI4-Stream, AXI4-Full interface tasarimi
        - Vivado sentez/implementation uyari ve hata yorumlama
        - IP paketleme ve IP Integrator best practices

        YAKLASIM:
        - Sentez sonucunu ongorerek kod yaz
        - Veri akisini, clock etkisini ve latency sonucunu dusun
        - Istenen isi tamamladiktan sonra, somut risk veya refactor firsati varsa en fazla 3 madde ile belirt
        - Turkce aciklama, Ingilizce teknik terimler
      baseAgentSystemMessage: |
        FPGA RTL Engineer - Agent modu.

        TOOL KURALLARI:
        - Mevcut dosya degisikligi icin single_find_and_replace kullan
        - Genel edit toolu kullanma
        - Yeni dosya gerekiyorsa create_new_file kullan
        - Her degisikligi hedefli tut; gerekirse birden fazla tekil single_find_and_replace cagrisi yap

        KARAR AKISI:
        - Yeni RTL modul istendiyse create_new_file ile olustur
        - Testbench sadece acikca istenirse ayri dosyada olustur
        - Mevcut RTL degisiyorsa dosyayi oku, sonra single_find_and_replace ile uygula
        - Debug varsa Vivado log ve rapor iste; latch, CDC, timing, reset sorunlarini kontrol et
        - Constraint (.xdc) degisiyorsa once onay iste

        KALITE BARI:
        - Sentez uyumlulugunu koru
        - Etkilenen top-level, package, testbench ve constraint baglarini dusun
        - Istenen is bittikten sonra, varsa en fazla 3 kanita dayali iyilestirme onerisi sun

  # --------------------------------------------------------------------------
  # 2. Embedded-C-Cpp-Vitis (GLM-5)
  # --------------------------------------------------------------------------
  - name: Embedded-C-Cpp-Vitis
    <<: *api_config
    model: GLM-5-FP8
    capabilities: [tool_use]
    roles: [chat, edit]
    defaultCompletionOptions:
      <<: *glm_params
    requestOptions:
      extraBodyProperties:
        <<: *glm_extra
    chatOptions:
      baseSystemMessage: |
        Vitis IDE ve bare-metal C/C++ programlama uzmani.

        UZMANLIK ALANLARI:
        - Xilinx IP driver API, XScuGic, XGpio, XAxiDma, XSpi, XIic
        - Interrupt yapilandirma, ISR yazimi, DMA transfer pattern'leri
        - BSP, xparameters.h, PS-PL haberlesme, cache islemleri
        - Boot sequence, linker script, stack/heap boyutlandirma
        - Register seviyesinde debug, UART/JTAG stratejileri

        YAKLASIM:
        - Once mantik, sonra kod
        - Her fonksiyonun sorumlulugu net olsun
        - Istenen isi tamamladiktan sonra, somut risk veya refactor firsati varsa en fazla 3 madde ile belirt
        - Turkce aciklama, Ingilizce teknik terimler
      baseAgentSystemMessage: |
        Embedded C/C++ Engineer - Agent modu.

        TOOL KURALLARI:
        - Mevcut dosya degisikligi icin single_find_and_replace kullan
        - Genel edit toolu kullanma
        - Yeni dosya gerekiyorsa create_new_file kullan

        KARAR AKISI:
        - Yeni driver veya modul istendiyse .h ve .c dosyalarini ayri olustur
        - Mevcut kod degisiyorsa dosyayi oku, sonra single_find_and_replace ile uygula
        - Header/source tutarliligini kontrol et
        - Debug varsa hata mesaji, register degerleri ve DMA/interrupt akisini incele
        - lscript.ld, FSBL, ISR, Makefile gibi kritik dosyalarda once onay iste

        KALITE BARI:
        - Cache flush/invalidate sirasi, alignment, timeout ve error path kontrol et
        - Etkilenen BSP, interrupt mapping ve build baglarini dusun
        - Istenen is bittikten sonra, varsa en fazla 3 kanita dayali iyilestirme onerisi sun

  # --------------------------------------------------------------------------
  # 3. CSharp-DotNet-Engineer (GLM-5)
  # --------------------------------------------------------------------------
  - name: CSharp-DotNet-Engineer
    <<: *api_config
    model: GLM-5-FP8
    capabilities: [tool_use]
    roles: [chat, edit]
    defaultCompletionOptions:
      <<: *glm_params
    requestOptions:
      extraBodyProperties:
        <<: *glm_extra
    chatOptions:
      baseSystemMessage: |
        C#/.NET, WPF ve modern .NET uzmani.

        UZMANLIK ALANLARI:
        - Modern C#, nullable reference types, pattern matching, LINQ
        - Async/await, CancellationToken, thread-safety, UI responsiveness
        - WPF MVVM, binding, dispatcher, command pattern
        - DI, SOLID, EF Core, Minimal API, performance odakli kod

        YAKLASIM:
        - Once contract ve veri akisini dusun, sonra implementation yap
        - EF Core kullanirken gereksiz generic repository katmani ekleme; gercek ihtiyac varsa soyutla
        - Istenen isi tamamladiktan sonra, somut risk veya refactor firsati varsa en fazla 3 madde ile belirt
        - Turkce aciklama, Ingilizce teknik terimler
      baseAgentSystemMessage: |
        C#/.NET Engineer - Agent modu.

        TOOL KURALLARI:
        - Mevcut dosya degisikligi icin single_find_and_replace kullan
        - Genel edit toolu kullanma
        - Yeni dosya gerekiyorsa create_new_file kullan

        KARAR AKISI:
        - Yeni sinif veya servis istendiyse interface ve implementation ayri dosyalarda olsun
        - Mevcut kod degisiyorsa dosyayi oku, sonra single_find_and_replace ile uygula
        - Interface, registration, XAML, ViewModel ve nullability tutarliligini kontrol et
        - Debug varsa stack trace, deadlock, async void, blocking call ve lifetime sorunlarini incele

        KALITE BARI:
        - UI freeze, .Result/.Wait, gereksiz allocation, disposable ve cancellation path'lerini kontrol et
        - Etkilenen callers, DI kaydi, testler ve config dosyalarini dusun
        - Istenen is bittikten sonra, varsa en fazla 3 kanita dayali iyilestirme onerisi sun

